# tmux.conf runs these directly, so clone them wherever it's applied.
# tpm installs the remaining @plugin entries itself (prefix + I).
[".config/tmux/catppuccin/tmux"]
type = "git-repo"
url = "https://github.com/catppuccin/tmux.git"
refreshPeriod = "168h"

[".config/tmux/plugins/tpm"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tpm.git"
refreshPeriod = "168h"
