set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

if-shell '[ -x /opt/homebrew/bin/fish ]' \
  'set -g default-shell /opt/homebrew/bin/fish' \
  'set -g default-shell /usr/bin/fish'
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB:clipboard'
set -g focus-events on
set -g set-clipboard on
set -s escape-time 0
set -g history-limit 100000

set -g set-titles on
set -g set-titles-string '#S · #I:#W'

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
setw -g mode-keys vi

bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux reloaded'

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n C-l send-keys C-l \; send-keys -R \; clear-history

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind p run-shell '{ pbpaste 2>/dev/null || wl-paste -n; } | tmux load-buffer - && tmux paste-buffer'

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-left-length 80
set -g status-right-length 120

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'none'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ' '
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_directory_text ' #{b:pane_current_path}'
set -g @catppuccin_date_time_text ' %H:%M'

run '~/.config/tmux/catppuccin/tmux/catppuccin.tmux'

set -g window-status-separator ' '
set -g window-status-format '#[fg=#{@thm_subtext_0},bg=default] #I #W #[default]'
set -g window-status-current-format '#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] #I #W #[default]'
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'trevarj/tmux-open-nvim'

run '~/.config/tmux/plugins/tpm/tpm'
