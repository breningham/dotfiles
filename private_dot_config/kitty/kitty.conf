# kitty.conf — shared by the CachyOS desktop and the MacBook. Catppuccin Macchiato, glassy.
# OS-specific settings live in linux.conf / macos.conf (included at the end).

# ── Theme ──────────────────────────────────────────────────────────────────
# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# Blurred-glass window (KWin's Better Blur on Linux, native blur on macOS).
background_opacity 0.82
background_blur 48
dynamic_background_opacity yes
inactive_text_alpha 0.7
dim_opacity 0.5
# Tab bar inherits the window background so the glass runs edge to edge.
tab_bar_background none
tab_bar_margin_color none

# Subtle lift for the active pane: lavender border, dimmed inactive borders.
active_border_color   #b7bdf8
inactive_border_color #363a4f
bell_border_color     #eed49f

# ── Shell & tools ──────────────────────────────────────────────────────────
shell_integration enabled

# ── Typography ─────────────────────────────────────────────────────────────
font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
modify_font cell_height 110%
modify_font underline_position 2
modify_font underline_thickness 150%
disable_ligatures cursor
# Maple Mono stylistic sets: alt @ $ &, == != ligatures, <= >= style, slashed zero.
font_features MapleMono-NF-Regular    +cv01 +ss01 +ss02 +zero
font_features MapleMono-NF-Bold       +cv01 +ss01 +ss02 +zero
font_features MapleMono-NF-Italic     +cv01 +ss01 +ss02 +zero
font_features MapleMono-NF-BoldItalic +cv01 +ss01 +ss02 +zero
text_composition_strategy platform
undercurl_style thin-sparse
underline_hyperlinks always
url_style curly

# ── Cursor ─────────────────────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.8
cursor_shape_unfocused hollow
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 15.0
# Cursor trail with motion blur. Alternatives: cursor-trail-blaze, cursor-trail-lightning.
cursor_trail 1
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 2
cursor_trail_color #c6a0f6
custom_shaders cursor-trail-motion-blur

# ── Window geometry ────────────────────────────────────────────────────────
remember_window_size yes
initial_window_width  130c
initial_window_height 38c
placement_strategy center
window_border_width 1.5pt
draw_minimal_borders yes
window_margin_width 6
single_window_margin_width 0
window_padding_width 10 14
single_window_padding_width 12 18
resize_in_steps no
resize_debounce_time 0.05 0.3
confirm_os_window_close -1

# Scrollbar: appears while scrolling or on hover, pill-shaped.
scrollbar scrolled-or-hovered
scrollbar_width 0.4
scrollbar_radius 0.2
scrollbar_handle_color #6e738d
scrollbar_handle_opacity 0.6
scrollbar_track_opacity 0
scrollbar_hover_width 0.6

# ── Tabs ───────────────────────────────────────────────────────────────────
enabled_layouts splits,stack,fat,tall
tab_bar_edge top
tab_bar_align left
tab_bar_style custom
tab_bar_min_tabs 1
tab_bar_margin_height 6 2
tab_bar_margin_width 0
tab_title_max_length 28
tab_title_template "{title}"
tab_activity_symbol ""
tab_switch_strategy previous
active_tab_font_style bold
inactive_tab_font_style normal

# ── Scrollback, bell, misc ─────────────────────────────────────────────────
scrollback_lines 20000
scrollback_pager_history_size 64
scrollback_fill_enlarged_window yes
enable_audio_bell no
visual_bell_duration 0.1 ease-out
visual_bell_color #494d64
bell_on_tab "󰂚 "
notify_on_cmd_finish invisible 15.0
mouse_hide_wait 2.0
copy_on_select clipboard
strip_trailing_spaces smart
paste_actions quote-urls-at-prompt,confirm
focus_follows_mouse no
sync_to_monitor yes
input_delay 2
repaint_delay 8
update_check_interval 0

# Remote control (used by Claude Code hooks to open diff panes)
allow_remote_control yes

# ── Keymaps ────────────────────────────────────────────────────────────────
# New shells and tabs inherit the active project directory.
map ctrl+t            launch --type=tab --cwd=current
map ctrl+enter        launch --location=split  --cwd=current
map ctrl+d            launch --location=vsplit --cwd=current
map ctrl+shift+d      launch --location=hsplit --cwd=current
map ctrl+shift+r      layout_action rotate
map ctrl+shift+z      toggle_layout stack
map ctrl+shift+l      next_layout
map ctrl+w            close_window_with_confirmation

# Tabs
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+.      move_tab_forward
map ctrl+shift+,      move_tab_backward
map ctrl+shift+t      set_tab_title
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Panes: Ctrl+Alt moves focus, +Shift moves the pane, Ctrl+Alt+Shift+hjkl resizes.
map ctrl+alt+left        neighboring_window left
map ctrl+alt+right       neighboring_window right
map ctrl+alt+up          neighboring_window up
map ctrl+alt+down        neighboring_window down
map ctrl+alt+shift+left  move_window left
map ctrl+alt+shift+right move_window right
map ctrl+alt+shift+up    move_window up
map ctrl+alt+shift+down  move_window down
map ctrl+alt+shift+h     resize_window narrower 3
map ctrl+alt+shift+l     resize_window wider 3
map ctrl+alt+shift+k     resize_window taller 3
map ctrl+alt+shift+j     resize_window shorter 3
map ctrl+alt+shift+0     resize_window reset
map ctrl+shift+enter     toggle_maximized
map ctrl+shift+f         focus_visible_window
map ctrl+shift+s         swap_with_window

# Function keys from the old setup.
map f4 launch --location=split  --cwd=current
map f5 launch --location=hsplit --cwd=current
map f6 launch --location=vsplit --cwd=current
map f7 layout_action rotate

# Claude Code workflow: Ctrl+Shift+A then c = Claude in a split, r = review pane
# (the edit hook reuses it: it is found by its role=review var in the same tab),
# n = Neovim in a split. (<leader>ac inside Neovim launches a Claude wired to that editor.)
map ctrl+shift+a>c     launch --location=vsplit --bias=42 --cwd=current --title=claude --var=role=claude claude
map ctrl+shift+a>r     launch --location=vsplit --bias=58 --cwd=current --title=claude-review --var=role=review nvim --cmd "let g:claude_review = 1" -c "DiffviewOpen"
map ctrl+shift+a>n     launch --location=vsplit --cwd=current nvim

# Glass controls: Ctrl+Shift+A then +/-/0 for opacity, b toggles blur-friendly solid.
map ctrl+shift+a>plus  set_background_opacity +0.05
map ctrl+shift+a>minus set_background_opacity -0.05
map ctrl+shift+a>0     set_background_opacity default
map ctrl+shift+a>1     set_background_opacity 1
map ctrl+shift+a>t     toggle_tab
map ctrl+shift+a>m     toggle_marker

# Scrollback / kittens. In the pager: / searches, n/N step through matches, q returns.
map ctrl+shift+h      show_scrollback
map ctrl+shift+g      show_last_command_output
map ctrl+shift+u      kitten hints
map ctrl+shift+p>f    kitten hints --type path --program -
map ctrl+shift+p>l    kitten hints --type line --program -
map ctrl+shift+p>h    kitten hints --type hash --program -
map ctrl+shift+e      kitten unicode_input
map ctrl+shift+f2     edit_config_file
map ctrl+shift+f5     load_config_file
map ctrl+shift+f6     debug_config

# Zoom
map ctrl+plus   change_font_size all +1.0
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# Leave Shift+Enter and the Kitty keyboard protocol to the foreground app.

# ── Per-OS settings (KITTY_OS is linux or macos) ──────────────────────────
include ${KITTY_OS}.conf
