# MacBook. Included from kitty.conf.
shell /opt/homebrew/bin/fish --login
editor zed --wait
font_size 13.0
# Native title bar with traffic lights; tab_bar.py skips its KDE-only buttons here.
hide_window_decorations no
macos_titlebar_color background
macos_option_as_alt left
macos_quit_when_last_window_closed no
# macOS has no abstract sockets, so use a path; kitty appends -<pid>.
listen_on unix:/tmp/kitty
