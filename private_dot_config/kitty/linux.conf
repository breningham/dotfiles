# CachyOS / KDE Plasma (Wayland). Included from kitty.conf.
shell /usr/bin/fish --login
linux_display_server wayland
wayland_enable_ime yes
wayland_titlebar_color background
font_size 12.5
# tab_bar.py draws its own min/max/close pill and drags the window via KWin.
hide_window_decorations titlebar-only
# Abstract socket; kitty appends -<pid>. The Claude hooks read KITTY_LISTEN_ON.
listen_on unix:@kitty
