# Cmd shortcuts for the MacBook, included from macos-keys.conf when kitty_keys is "cmd".
# The Ctrl+Shift and Option shortcuts from kitty.conf still apply.

# Hand these back to the shell and TUIs: Ctrl+D is EOF, Ctrl+W deletes a word,
# Ctrl+T is the fzf file picker.
map ctrl+t     no_op
map ctrl+d     no_op
map ctrl+w     no_op
map ctrl+enter no_op

# New shells and tabs inherit the active project directory.
map cmd+t       launch --type=tab --cwd=current
map cmd+enter   launch --location=split  --cwd=current
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+shift+r layout_action rotate
map cmd+shift+z toggle_layout stack
map cmd+w       close_window_with_confirmation

# Panes: Cmd+Option moves focus, +Shift moves the pane, Cmd+Ctrl resizes.
map cmd+alt+left        neighboring_window left
map cmd+alt+right       neighboring_window right
map cmd+alt+up          neighboring_window up
map cmd+alt+down        neighboring_window down
map cmd+alt+shift+left  move_window left
map cmd+alt+shift+right move_window right
map cmd+alt+shift+up    move_window up
map cmd+alt+shift+down  move_window down
map cmd+ctrl+left       resize_window narrower 3
map cmd+ctrl+right      resize_window wider 3
map cmd+ctrl+up         resize_window taller 3
map cmd+ctrl+down       resize_window shorter 3

# Scrollback / kittens.
map cmd+shift+h  show_scrollback
map cmd+shift+g  show_last_command_output
map cmd+shift+u  kitten hints
map cmd+shift+f5 load_config_file
