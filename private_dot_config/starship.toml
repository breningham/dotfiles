"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = "catppuccin_mocha"
right_format = """$mise $nodejs $aws"""


[os]
disabled = false
style = "bold mauve"

[os.symbols]
Macos = ""
Arch = ""

[character]
success_symbol = "[(green) ❯](peach)"
error_symbol = "[(red) ❯](peach)"
vimcmd_symbol = "[ ❮](subtext1)" # For use with zsh-vi-mode

[package]
disabled = true

[git_branch]
symbol = " "
style = "bold mauve"
ignore_bare_repo = true

[mise]
disabled = false
format = '[ \[mise $health\]]($style)'
symbol = ' '
healthy_symbol = ' '
unhealthy_symbol = ' '
style = 'bold peach'

[nodejs]
format = '[\[$symbol $version\]]($style)'

[aws]
format = '[\[$symbol$profile\]]($style)'
style = 'bold lavender'
symbol = ' '
[aws.profile_aliases]
Enterprise_Naming_schema-voidstars = 'void**'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
